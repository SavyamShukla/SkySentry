# ── SkySentry AI Backend — Spring Boot Configuration ──

server.port=8000
spring.main.banner-mode=off

# ── Model ──
# Path to the ONNX model (converted from best.pt)
# Set to 'best.onnx' relative to the 'Sky SENTRY 2' workspace root
skysentry.model-path=best.onnx

# ── Media ──
# Directory containing images/videos for scanning
# Set to 'backend-spring/media' relative to the workspace root
skysentry.media-dir=backend-spring/media

# ── Inference ──
skysentry.confidence-threshold=0.25

# ── SQLite Database ──
spring.datasource.url=jdbc:sqlite:archive.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# ── Schema Initialization ──
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ── Multipart File Upload (for /analyze) ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Logging ──
logging.level.com.skysentry=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%logger{20}] %level: %msg%n
