<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkySentry AI // v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:     #06090b;
    --bg2:    #080d10;
    --bg3:    #0a1018;
    --panel:  #080d11;
    --border: #0f2015;
    --green:  #00e676;
    --green2: #00c853;
    --cyan:   #00e5ff;
    --amber:  #ffb300;
    --red:    #ff1744;
    --orange: #ff6d00;
    --text:   #a8c8a8;
    --textd:  #3a5a3a;
    --textm:  #6a8a6a;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Rajdhani', sans-serif;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP BAR --- */
  .topbar {
    height: 42px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 0;
    flex-shrink: 0;
    position: relative;
  }
  .brand {
    font-family: var(--head);
    font-size: 16px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 3px;
    margin-right: 28px;
    white-space: nowrap;
  }
  .status-row { display: flex; gap: 18px; align-items: center; }
  .si { display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--textd); font-family: var(--head); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); }
  .dot.amber { background: var(--amber); box-shadow: 0 0 5px var(--amber); }

  /* --- MAIN LAYOUT --- */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* --- LEFT PANEL --- */
  .left-panel { width: 172px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .node-header { padding: 14px 12px; border-bottom: 1px solid var(--border); }
  .node-name { font-family: var(--head); font-size: 16px; font-weight: 700; color: var(--green); }
  .nav-items { flex: 1; padding: 6px 0; }
  .nav-item { padding: 9px 14px; font-size: 9px; color: var(--textd); cursor: pointer; font-family: var(--head); }
  .nav-item.active { color: var(--green); background: rgba(0,230,118,0.04); }
  .initiate-btn {
    margin: 10px 12px; padding: 11px 8px; background: transparent; border: 1px solid var(--green);
    color: var(--green); font-family: var(--mono); cursor: pointer;
  }
  .initiate-btn:disabled { opacity: 0.3; }

  /* --- CENTER / CAMERA VIEW --- */
  .center { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
  .cam-view {
    flex: 1; position: relative; overflow: hidden; background: #000;
    background-image: linear-gradient(rgba(0,230,118,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,230,118,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* MEDIA LAYERS */
  #camera-stream, #scene-video, #scene-image, #scene-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; display: none;
  }

  /* SCREEN OVERLAYS */
  .screen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; z-index: 5; background: var(--bg); /* Black out when no feed */
  }
  .screen.hidden { display: none; }
  .screen.transparent { background: transparent; } /* Allow camera to show through */

  .await-big { font-family: var(--head); font-size: 18px; font-weight: 600; color: var(--textd); letter-spacing: 4px; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* HUD & BOXES */
  .cm { position: absolute; width: 18px; height: 18px; border-color: rgba(0,230,118,0.4); border-style: solid; z-index: 10; }
  .cm.tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
  .cm.tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
  .cm.bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
  .cm.br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

  .bboxes-container { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
  .threat-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(255,23,68,0.1); pointer-events: none; z-index: 20;
  }
  .threat-word { font-family: var(--head); font-size: 36px; font-weight: 700; letter-spacing: 8px; background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid var(--red); border-radius: 5px;}
  .threat-word.threat { color: var(--red); text-shadow: 0 0 30px rgba(255,23,68,0.5); }

  /* STAGE BAR */
  .stage-bar { height: 30px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; gap: 20px; }
  .stage-dot { width: 6px; height: 6px; border-radius: 50%; background: #1a2a1a; transition: 0.3s; }
  .stage-dot.active { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
  .stage-dot.done { background: var(--green); box-shadow: 0 0 5px var(--green); }

  /* RIGHT PANEL */
  .right-panel { width: 210px; background: var(--panel); border-left: 1px solid var(--border); padding: 12px; }
  .rp-title { font-size: 8px; color: var(--textd); letter-spacing: 2px; margin-bottom: 10px; }

  /* LOGS */
  .log-panel { height: 120px; background: var(--bg2); border-top: 1px solid var(--border); overflow-y: auto; padding: 10px; }
  .log-entry { font-size: 9px; margin-bottom: 2px; }
  .log-ts { color: var(--textd); margin-right: 8px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.visible { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); width: 350px; padding: 25px; text-align: center; }
  .scan-option { background: #111; border: 1px solid var(--border); padding: 15px; margin-top: 10px; cursor: pointer; color: var(--green); font-weight: bold; }
  .scan-option:hover { border-color: var(--green); }

  /* ARCHIVE VIEW */
  .archive-view {
    flex: 1; display: none; flex-direction: column; background: var(--bg); padding: 20px; overflow-y: auto;
  }
  .archive-table { width: 100%; border-collapse: collapse; color: var(--text); font-family: var(--mono); }
  .archive-table th, .archive-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
  .archive-table th { background: var(--bg2); color: var(--green); font-family: var(--head); font-size: 14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SKYSENTRY<span> AI //</span> v1.0</div>
  <div class="status-row">
    <div class="si"><div class="dot"></div> SYSTEM ACTIVE</div>
    <div class="si"><div class="dot" id="ai-dot" style="background:var(--textd)"></div> AI ENGINE</div>
  </div>
</div>

<div class="layout">
  <div class="left-panel">
    <div class="node-header">
      <div class="node-name">STRAT_COM</div>
    </div>
    <div class="nav-items">
      <div class="nav-item active" id="nav-live" onclick="showLive()">THREAT_LVL</div>
      <div class="nav-item" id="nav-archive" onclick="showArchive()">ARCHIVE</div>
    </div>
    <button class="initiate-btn" id="scan-btn" onclick="initiateScan()">[ INITIATE_SCAN ]</button>
  </div>

  <div class="center">
    <div class="cam-view" id="cam-view">
      <div class="cm tl"></div><div class="cm tr"></div><div class="cm bl"></div><div class="cm br"></div>
      
      <div class="screen" id="s-await">
        <div class="await-big">AWAITING RADAR INPUT<span class="blink">_</span></div>
      </div>

      <video id="camera-stream" autoplay muted playsinline></video>
      <video id="scene-video" muted playsinline></video>
      <img id="scene-image">
      <canvas id="scene-canvas"></canvas>
      <div class="bboxes-container" id="bboxes-container"></div>

      <div class="threat-overlay" id="threat-overlay">
        <div class="threat-word" id="threat-word">THREAT CONFIRMED</div>
        <div id="threat-sub" style="color:var(--textm); margin-top:10px;">ANALYZING...</div>
      </div>
    </div>

    <div class="archive-view" id="archive-view">
      <h2 style="color:var(--green); margin-bottom:15px; font-family:var(--head); font-size: 20px;">SCAN ARCHIVE</h2>
      <table class="archive-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>TIMESTAMP</th>
            <th>THREAT</th>
            <th>CONFIDENCE</th>
            <th>SECTOR</th>
            <th>ALT (m)</th>
          </tr>
        </thead>
        <tbody id="archive-tbody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

    <div class="stage-bar">
      <div class="stage-dot" id="s1"></div><span>RADAR</span>
      <div class="stage-dot" id="s2"></div><span>LOCK</span>
      <div class="stage-dot" id="s3"></div><span>FEED</span>
      <div class="stage-dot" id="s4"></div><span>AI</span>
      <div class="stage-dot" id="s5"></div><span>CLASS</span>
      <div class="stage-dot" id="s6"></div><span>DECISION</span>
    </div>
  </div>

  <div class="right-panel">
    <div class="rp-title">// TELEMETRY</div>
    <div id="t-alt" style="color:var(--cyan); font-size:10px;">ALT: ---</div>
    <div id="t-spd" style="color:var(--cyan); font-size:10px;">SPD: ---</div>
  </div>
</div>

<div class="log-panel" id="log-scroll"></div>

<div class="modal-overlay" id="scan-modal">
  <div class="modal">
    <div class="scan-option" onclick="selectCameraFeed()">START CAMERA SCAN</div>
    <div class="scan-option" onclick="selectDemoFeed()">START SIMULATION</div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8000';
let running = false;
let backendAvailable = false;
let analysisLoop;
let hasArchived = false;
let clearThreatTimeout;

function addLog(msg, type='info') {
  const scroll = document.getElementById('log-scroll');
  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  el.innerHTML = `<span class="log-ts">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
  scroll.insertBefore(el, scroll.firstChild);
}

function setStage(idx, done=false) {
  for(let i=1; i<=6; i++) {
    const d = document.getElementById('s'+i);
    if(i < idx) d.className = 'stage-dot done';
    else if(i === idx) d.className = done ? 'stage-dot done' : 'stage-dot active';
    else d.className = 'stage-dot';
  }
}

async function startCamera() {
  const camEl = document.getElementById('camera-stream');
  try {
    addLog('Requesting camera hardware...', 'info');
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    camEl.srcObject = stream;
    camEl.style.display = 'block';
    camEl.style.objectFit = 'fill'; // Force fill to match bboxes simply
    
    return new Promise((resolve) => {
      camEl.onloadedmetadata = () => {
        camEl.play();
        const check = setInterval(() => {
          if (camEl.videoWidth > 0) {
            clearInterval(check);
            addLog(`Hardware ready: ${camEl.videoWidth}x${camEl.videoHeight}`, 'ok');
            resolve(true);
          }
        }, 100);
      };
    });
  } catch(e) {
    addLog('Camera Error: ' + e.message, 'alert');
    return false;
  }
}

async function startDemoVideo() {
  const vidEl = document.getElementById('scene-video');
  vidEl.crossOrigin = "anonymous"; // Prevents canvas "tainted" security errors
  vidEl.src = API_BASE + '/media/drone3.mp4';
  vidEl.style.display = 'block';
  vidEl.style.objectFit = 'fill';
  vidEl.loop = true;
    vidEl.onended = () => { vidEl.currentTime = 0; vidEl.play(); };

  return new Promise((resolve) => {
    vidEl.onloadedmetadata = () => {
      vidEl.play().then(() => resolve(true)).catch(() => resolve(false));
      addLog(`Demo feed locked.`, 'ok');
    };
    vidEl.onerror = () => {
      addLog(`Failed to load demo feed. Is the backend running?`, 'alert');
      resolve(false);
    };
  });
}

function initiateScan() {
  if(running) {
    resetUI();
    return;
  }
  document.getElementById('scan-modal').classList.add('visible');
}

async function selectCameraFeed() {
  document.getElementById('scan-modal').classList.remove('visible');
  await runPipeline('camera');
}

async function selectDemoFeed() {
  document.getElementById('scan-modal').classList.remove('visible');
  await runPipeline('demo');
}

async function analyzeFrame(videoEl) {
  if (!running) return;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    const base64 = canvas.toDataURL('image/jpeg', 0.8);
    
    const reqBody = { image: base64, media_type: 'image/jpeg' };
    const res = await fetch(`${API_BASE}/analyze/base64`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody)
    });
    
    if (!res.ok) throw new Error('API Error: ' + res.status);
    const data = await res.json();
    
    // Draw BBoxes
    const container = document.getElementById('bboxes-container');
    container.innerHTML = '';
    
    const rect = videoEl.getBoundingClientRect();
    const scaleX = rect.width / canvas.width;
    const scaleY = rect.height / canvas.height;
    
    let isThreat = false;
    let mainThreat = '';
    
    if (data.detections && data.detections.length > 0) {
      setStage(5, true); // CLASS
      data.detections.forEach(d => {
        const [x1, y1, x2, y2] = d.bbox;
        const div = document.createElement('div');
        div.style.position = 'absolute';
        div.style.left = (x1 * scaleX) + 'px';
        div.style.top = (y1 * scaleY) + 'px';
        div.style.width = ((x2 - x1) * scaleX) + 'px';
        div.style.height = ((y2 - y1) * scaleY) + 'px';
        div.style.border = '2px solid var(--red)';
        div.style.boxShadow = '0 0 10px var(--red)';
        
        const label = document.createElement('div');
        label.style.position = 'absolute';
        label.style.top = '-15px';
        label.style.left = '0';
        label.style.color = 'var(--text)';
        label.style.backgroundColor = 'var(--red)';
        label.style.padding = '0 4px';
        label.style.fontSize = '10px';
        label.style.fontWeight = 'bold';
        label.textContent = `${d.class.toUpperCase()} ${(d.confidence*100).toFixed(1)}%`;
        div.appendChild(label);
        
        container.appendChild(div);
        
        if (clearThreatTimeout) { clearTimeout(clearThreatTimeout); clearThreatTimeout = null; } isThreat = true;
        mainThreat = d.class.toUpperCase();
      });
      
      setStage(6, true);
      document.getElementById('threat-overlay').style.display = 'flex';
      document.getElementById('threat-sub').textContent = `OBJECT: ${mainThreat} // CONFIDENCE: ${(data.detections[0].confidence*100).toFixed(1)}%`;
      document.getElementById('threat-word').classList.add('threat');

      // Archive detection if not already archived
      if (!hasArchived) {
        hasArchived = true;
        fetch(`${API_BASE}/archive`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            scan_number: Math.floor(Math.random() * 10000) + 1,
            media_type: 'live_feed',
            media_file: 'camera_capture',
            detections: data.detections,
            top_class: mainThreat,
            top_confidence: data.detections[0].confidence,
            threat_level: (mainThreat === 'DRONE' || mainThreat === 'AIRPLANE') ? 'high' : 'low',
            sector: 'SECTOR-7G',
            altitude_m: 120.0
          })
        }).catch(err => console.error('Archive error:', err));
      }
    } else {
      if (!clearThreatTimeout && document.getElementById('threat-overlay').style.display === 'flex') {
        clearThreatTimeout = setTimeout(() => {
          document.getElementById('threat-overlay').style.display = 'none';
          document.getElementById('threat-word').classList.remove('threat');
          setStage(4, true);
          hasArchived = false;
          clearThreatTimeout = null;
        }, 4000);
      } else if (document.getElementById('threat-overlay').style.display !== 'flex') {
        document.getElementById('threat-overlay').style.display = 'none';
        document.getElementById('threat-word').classList.remove('threat');
        setStage(4, true); // Still Analyzing
      }
    }
  } catch(e) {
     console.error("Frame analysis error:", e);
  }
  
  if(running) {
    analysisLoop = setTimeout(() => analyzeFrame(videoEl), 500); // Analyze twice per second
  }
}

async function runPipeline(mode) {
  running = true;
  hasArchived = false;
  document.getElementById('scan-btn').textContent = '[ STOP_SCAN ]';

  // 1. RADAR
  setStage(1, true); addLog('Scanning Radar Sectors...', 'info');
  if(!running) return;
  await new Promise(r => setTimeout(r, 1000));

  // 2. LOCK
  setStage(2, true); addLog('Target Signature Locked.', 'warn');
  if(!running) return;
  await new Promise(r => setTimeout(r, 800));

  // 3. FEED ACQUISITION
  setStage(3);
  let videoEl;
  if(mode === 'camera') {
    const ok = await startCamera();
    if(!ok) { resetUI(); return; }
    videoEl = document.getElementById('camera-stream');
    document.getElementById('s-await').classList.add('hidden');
    addLog('Stabilizing optical sensors...', 'info');
  } else {
    const ok = await startDemoVideo();
    if(!ok) { resetUI(); return; }
    videoEl = document.getElementById('scene-video');
    document.getElementById('s-await').classList.add('hidden');
  }
  if(!running) return;
  await new Promise(r => setTimeout(r, 1000));

  // 4. AI ANALYSIS
  setStage(4);
  document.getElementById('ai-dot').style.background = 'var(--amber)';
  addLog('AI Engine performing continuous analysis...', 'info');

  document.getElementById('t-alt').textContent = `ALT: 120m`;
  document.getElementById('t-spd').textContent = `SPD: 45km/h`;

  // Start analysis loop
  if(running) analyzeFrame(videoEl);
}

function resetUI() {
  running = false;
  clearTimeout(analysisLoop);
  if (clearThreatTimeout) {
    clearTimeout(clearThreatTimeout);
    clearThreatTimeout = null;
  }
  document.getElementById('scan-btn').disabled = false;
  document.getElementById('scan-btn').textContent = '[ INITIATE_SCAN ]';
  document.getElementById('threat-overlay').style.display = 'none';
  document.getElementById('threat-word').classList.remove('threat');
  document.getElementById('bboxes-container').innerHTML = '';
  document.getElementById('s-await').classList.remove('hidden');
  
  const camStream = document.getElementById('camera-stream').srcObject;
  if(camStream) camStream.getTracks().forEach(t => t.stop());
  
  document.getElementById('camera-stream').style.display = 'none';
  const vidEl = document.getElementById('scene-video');
  vidEl.pause();
  vidEl.style.display = 'none';
  vidEl.src = "";
  
  document.getElementById('ai-dot').style.background = 'var(--textd)';
  setStage(0);
}

function showLive() {
  document.getElementById('nav-archive').classList.remove('active');
  document.getElementById('nav-live').classList.add('active');
  document.getElementById('archive-view').style.display = 'none';
  document.getElementById('cam-view').style.display = '';
}

async function showArchive() {
  document.getElementById('nav-live').classList.remove('active');
  document.getElementById('nav-archive').classList.add('active');
  document.getElementById('cam-view').style.display = 'none';
  document.getElementById('archive-view').style.display = 'flex';
  
  if (running) {
    resetUI();
  }
  
  await loadArchiveData();
}

async function loadArchiveData() {
  try {
    const res = await fetch(`${API_BASE}/archive`);
    if (!res.ok) throw new Error('Failed to fetch archive');
    const data = await res.json();
    
    const tbody = document.getElementById('archive-tbody');
    tbody.innerHTML = '';
    
    if (data.scans && data.scans.length > 0) {
      data.scans.forEach(scan => {
        const tr = document.createElement('tr');
        
        let threatColor = scan.threat_level === 'high' ? 'var(--red)' : 
                         (scan.threat_level === 'medium' ? 'var(--amber)' : 'var(--green)');
                         
        let confPercent = scan.top_confidence ? (scan.top_confidence * 100).toFixed(1) + '%' : '---';
        
        tr.innerHTML = `
          <td>#${scan.id}</td>
          <td>${new Date(scan.timestamp).toLocaleString()}</td>
          <td style="color:${threatColor}; font-weight:bold;">${scan.top_class || 'NONE'}</td>
          <td>${confPercent}</td>
          <td>${scan.sector || '---'}</td>
          <td>${scan.altitude_m || '---'}</td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No archive data found.</td></tr>`;
    }
  } catch(e) {
    console.error(e);
    const tbody = document.getElementById('archive-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--red);">Error loading archive data.</td></tr>`;
  }
}
</script>
</body>
</html>
